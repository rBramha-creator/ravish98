<style>
  .post-header{ padding:calc(var(--nav-h) + 56px) 40px 0; max-width:760px; margin:0 auto; }
  .post-back{
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--gray);
    text-decoration:none; display:inline-flex; align-items:center; gap:8px; margin-bottom:28px; transition:color 0.2s;
  }
  .post-back:hover{ color:var(--amber); }
  .post-date{ font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--amber); margin-bottom:18px; }
  .post-title{
    font-family:'Qwitcher Grypen',cursive; font-weight:700; font-size:clamp(40px,6.5vw,68px);
    line-height:0.92; color:var(--bone); margin-bottom:28px;
  }
  .post-cover{ aspect-ratio:16/9; overflow:hidden; background:#efe6d6; margin:0 -40px 56px; }
  .post-cover img{ width:100%; height:100%; object-fit:cover; filter:grayscale(0.2) contrast(1.02); }

  .post-body{ max-width:760px; margin:0 auto; padding:0 40px 120px; }
  .post-body p{ font-size:16.5px; line-height:1.9; color:var(--gray); margin-bottom:26px; }
  .post-body p:first-of-type{
    font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size:22px;
    color:var(--bone); line-height:1.55; margin-bottom:32px;
  }
  .post-body strong{ color:var(--bone); font-weight:500; }
  .post-body em{ color:var(--bone); }

  @media(max-width:600px){
    .post-header{ padding:calc(var(--nav-h) + 30px) 20px 0; }
    .post-cover{ margin:0 0 40px; }
    .post-body{ padding:0 20px 80px; }
  }

  .post-footer-nav{
    max-width:760px; margin:0 auto; padding:0 40px 100px;
    display:flex; justify-content:space-between; gap:24px; border-top:1px solid rgba(42,18,12,0.1); padding-top:40px;
  }
  .post-footer-nav a{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gray);
    text-decoration:none; transition:color 0.2s;
  }
  .post-footer-nav a:hover{ color:var(--amber); }
  @media(max-width:600px){ .post-footer-nav{ padding:0 20px 60px; } }

  .not-found{ padding:calc(var(--nav-h) + 100px) 40px 140px; text-align:center; }
  .not-found h1{ font-family:'Bebas Neue',sans-serif; font-size:clamp(40px,8vw,90px); color:var(--bone); text-transform:uppercase; margin-bottom:20px; }
  .not-found p{ color:var(--gray); margin-bottom:32px; }

<script src="assets/js/blog-data.js"></script>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const posts = (typeof BLOG_POSTS !== 'undefined') ? BLOG_POSTS : [];
  const post = posts.find(p => p.slug === slug);
  const container = document.getElementById('post-content');

  if (!post){
    container.innerHTML = `
      <div class="not-found">
        <h1>Post not found</h1>
        <p>This post may have moved or doesn't exist yet.</p>
        <a href="blog.html" class="btn">Back to journal</a>
      </div>
    `;
    return;
  }

  document.getElementById('page-title').textContent = post.title + ' — Ravish Bramhe';

  const idx = posts.indexOf(post);
  const prev = posts[idx - 1];
  const next = posts[idx + 1];

  container.innerHTML = `
    <header class="post-header">
      <a href="blog.html" class="post-back">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to journal
      </a>
      <div class="post-date">${post.date}</div>
      <h1 class="post-title">${post.title}</h1>
    </header>
    <div class="post-cover"><img src="${post.cover}" alt="${post.title}"></div>
    <article class="post-body">${post.body}</article>
    <div class="post-footer-nav">
      ${prev ? `<a href="blog-post.html?slug=${prev.slug}">← ${prev.title}</a>` : '<span></span>'}
      ${next ? `<a href="blog-post.html?slug=${next.slug}">${next.title} →</a>` : '<span></span>'}
    </div>
  `;
})();
</script>
