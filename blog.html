<style>
  .blog-list{ padding:0 40px 140px; }
  .blog-row{
    display:grid; grid-template-columns:280px 1fr auto; gap:40px; align-items:center;
    padding:36px 0; border-top:1px solid rgba(42,18,12,0.1); text-decoration:none;
  }
  .blog-list .blog-row:last-child{ border-bottom:1px solid rgba(42,18,12,0.1); }
  .blog-row-img{ aspect-ratio:4/3; overflow:hidden; background:#efe6d6; }
  .blog-row-img img{
    width:100%; height:100%; object-fit:cover; filter:grayscale(0.3) contrast(1.02);
    transition:transform 0.5s cubic-bezier(0.22,1,0.36,1), filter 0.4s ease;
  }
  .blog-row:hover .blog-row-img img{ transform:scale(1.05); filter:grayscale(0) contrast(1.05); }
  .blog-row:active .blog-row-img img{ transform:scale(1.02); filter:grayscale(0) contrast(1.05); }
  .blog-row-date{ font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--amber); margin-bottom:12px; }
  .blog-row-title{
    font-family:'Bebas Neue',sans-serif; font-size:clamp(24px,3.2vw,38px);
    text-transform:uppercase; color:var(--bone); line-height:1.1; margin-bottom:12px; transition:color 0.2s;
  }
  .blog-row:hover .blog-row-title{ color:var(--amber); }
  .blog-row:active .blog-row-title{ color:var(--amber); }
  .blog-row-excerpt{ font-size:14px; line-height:1.7; color:var(--gray); max-width:480px; }
  .blog-row-arrow{
    font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size:15px; color:var(--gray);
    white-space:nowrap; transition:color 0.2s;
  }
  .blog-row:hover .blog-row-arrow{ color:var(--amber); }

  @media(max-width:760px){
    .blog-list{ padding:0 20px 90px; }
    .blog-row{ grid-template-columns:1fr; gap:18px; }
    .blog-row-arrow{ display:none; }
  }

  .blog-empty{ padding:60px 0; color:var(--gray); font-family:'Fraunces',serif; font-style:italic; font-size:18px; }
</style>
</head>

<script src="assets/js/site.js"></script>
<script src="assets/js/blog-data.js"></script>
<script>
(function(){
  const list = document.getElementById('blog-list');
  const posts = (typeof BLOG_POSTS !== 'undefined') ? BLOG_POSTS : [];

  if (!posts.length){
    list.innerHTML = '<p class="blog-empty">New posts coming soon.</p>';
    return;
  }

  posts.forEach(post => {
    const a = document.createElement('a');
    a.href = `blog-post.html?slug=${encodeURIComponent(post.slug)}`;
    a.className = 'blog-row';
    a.innerHTML = `
      <div class="blog-row-img"><img loading="lazy" src="${post.cover}" alt="${post.title}"></div>
      <div>
        <div class="blog-row-date">${post.date}</div>
        <div class="blog-row-title">${post.title}</div>
        <div class="blog-row-excerpt">${post.excerpt}</div>
      </div>
      <div class="blog-row-arrow">Read →</div>
    `;
    list.appendChild(a);
  });
})();
</script>
